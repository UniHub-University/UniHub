name: CI
on:
  push:
    branches: [main]
    paths: ["Backend/**", "Tests/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["Backend/**", "Tests/**", ".github/workflows/ci.yml"]

jobs:
  build:
    name: Build (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        working-directory: Backend
        run: dotnet restore Backend.csproj
      - name: Build (Release)
        working-directory: Backend
        run: dotnet build Backend.csproj -c Release --no-restore
      - name: Verifica migrations pendentes
        working-directory: Backend
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes || {
            echo "::error::Modelo alterado sem migration. Rode 'dotnet ef migrations add <Nome>'."
            exit 1
          }

  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Tests/UniHub.Tests/UniHub.Tests.csproj
      - name: Build (Release)
        run: dotnet build Tests/UniHub.Tests/UniHub.Tests.csproj -c Release --no-restore
      # Roda SOMENTE os testes marcados com [Trait("Categoria","Unit")].
      # Os testes de integração (Categoria=Integracao) dependem da branch
      # development do Neon (env var UNIHUB_TEST_DB) e NÃO rodam no CI — eles
      # são executados localmente. Para rodá-los: defina UNIHUB_TEST_DB e use
      # --filter "Categoria=Integracao".
      - name: Testes unitários (Categoria=Unit)
        run: dotnet test Tests/UniHub.Tests/UniHub.Tests.csproj -c Release --no-build --filter "Categoria=Unit"

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Backend/Dockerfile -t unihub-api:ci Backend
